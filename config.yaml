# ==============================================================================
# Dynamic Configuration for Member 1: Workload Simulation and Monitoring
# Zero Hardcoded Constants: All operational parameters are declared here.
# ==============================================================================

simulation:
  duration_seconds: 120
  time_step_seconds: 1.0
  random_seed: 42
  export_format: "both" # Options: csv, parquet, both
  output_dir: "sample_data"
  output_csv_filename: "simulated_workload_telemetry.csv"
  output_parquet_filename: "simulated_workload_telemetry.parquet"

traffic_generator:
  active_pattern: "composite" # Options: steady, spike, gradual, noisy, composite
  
  steady:
    baseline_rps: 50.0
    jitter_std_dev: 5.0
    min_rps: 10.0
    max_rps: 200.0

  spike:
    baseline_rps: 40.0
    spike_amplitude_rps: 180.0
    spike_start_sec: 30.0
    spike_duration_sec: 25.0
    decay_rate: 0.15 # Exponential decay after spike ends

  gradual:
    baseline_rps: 30.0
    peak_rps: 120.0
    trend_type: "sinusoidal" # Options: linear_ramp, sinusoidal
    period_seconds: 60.0
    phase_shift_seconds: 0.0

  noisy:
    baseline_rps: 45.0
    noise_type: "gaussian_walk" # Options: poisson, gaussian_walk, brownian
    volatility: 8.0
    mean_reversion_rate: 0.1
    min_rps: 5.0
    max_rps: 250.0

  composite:
    base_pattern: "gradual"
    enable_spikes: true
    enable_noise: true
    spike_trigger_interval_sec: 45.0
    spike_magnitude_multiplier: 3.5
    spike_length_sec: 15.0
    noise_sigma: 6.0

resource_model:
  worker_pool:
    initial_workers: 4
    min_workers: 1
    max_workers: 16
    cpu_cores_per_worker: 2.0
    memory_mb_per_worker: 2048.0
    throughput_per_worker_rps: 25.0
    max_concurrency_per_worker: 30
    cold_start_delay_sec: 5.0
    warm_up_delay_sec: 2.0
    graceful_drain_delay_sec: 3.0
    idle_timeout_sec: 15.0
    auto_scaling:
      enabled: true
      target_cpu_utilization: 0.75
      target_queue_latency_sec: 0.5
      scale_up_step: 2
      scale_down_step: 1
      cooldown_period_sec: 10.0

  queue:
    queue_type: "FIFO" # Options: FIFO, Priority
    max_capacity: 500
    drop_policy: "DROP_TAIL" # Options: DROP_TAIL, DROP_HEAD, REJECT
    request_timeout_sec: 5.0

  latency_distribution:
    distribution: "lognormal" # Options: lognormal, exponential, normal
    base_service_time_ms: 28.0
    service_time_std_dev_ms: 8.0
    min_latency_ms: 5.0
    max_latency_ms: 3000.0
    concurrency_penalty_factor: 0.05 # Latency penalty when concurrency approaches worker limits

monitoring:
  exporter:
    host: "0.0.0.0"
    port: 8000
    endpoint: "/metrics"
    collection_interval_sec: 1.0
  prometheus:
    scrape_interval: "2s"
    scrape_timeout: "2s"
    target_host: "localhost"
    target_port: 8000
    metrics_path: "/metrics"
  grafana:
    dashboard_title: "Member 1 - Workload & Systems Telemetry"
    refresh_rate: "2s"
    time_window: "now-5m"

visualization:
  style: "seaborn-v0_8-darkgrid"
  dpi: 300
  figure_width_inches: 14
  figure_height_inches: 10
  save_path: "sample_data/workload_timeline.png"
  colors:
    request_rate: "#2563EB"    # Royal Blue
    capacity_rate: "#10B981"   # Emerald Green
    latency_p50: "#F59E0B"     # Amber
    latency_p95: "#F97316"     # Orange
    latency_p99: "#EF4444"     # Red
    cpu_util: "#8B5CF6"        # Violet
    memory_util: "#06B6D4"     # Cyan
    queue_depth: "#EC4899"     # Pink
    dropped: "#DC2626"         # Crimson
